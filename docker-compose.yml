version: "3.9"

services:

  backend:
    build: .
    container_name: jobtrackr_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7

    container_name: jobtrackr_redis

    ports:
      - "6379:6379"

  celery:
    build: .

    container_name: jobtrackr_celery

    command: celery -A jobtrackr_backend worker --pool=solo -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis

  celery-beat:
    build: .

    container_name: jobtrackr_celery_beat

    command: celery -A jobtrackr_backend beat -l info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - redis